<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quiz App</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 40px 20px;
    color: #333;
}

.card {
    max-width: 850px;
    margin: auto;
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

#progress {
    font-size: 14px;
    font-weight: 600;
    color: #666;
    margin-bottom: 10px;
}

.progress-bar {
    width: 100%;
    height: 10px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: width 0.3s ease;
}

.question {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 15px;
}

#questionImage {
    max-width: 100%;
    border-radius: 12px;
    margin-bottom: 20px;
    display: none;
}

.option {
    margin-bottom: 12px;
}

.option label {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.option label:hover {
    border-color: #2563eb;
    background: #f8fbff;
}

.option input {
    width: 18px;
    height: 18px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 15px;
    margin-right: 10px;
}

#submitBtn {
    background: #2563eb;
    color: white;
}

#submitBtn:hover:not(:disabled) {
    background: #1d4ed8;
}

#nextBtn {
    background: #10b981;
    color: white;
    display: none;
}

#nextBtn:hover {
    background: #059669;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#result {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    font-weight: 600;
}

.correct {
    background: #ecfdf5;
    color: #047857;
    border: 1px solid #a7f3d0;
}

.wrong {
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
}

#explanation {
    display: none;
    margin-top: 14px;
    padding: 16px 18px;
    border-radius: 10px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    color: #334155;
    font-size: 14px;
    line-height: 1.6;
}

#explanation .exp-title {
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 6px;
    display: block;
}

#summary {
    display: none;
    text-align: center;
}

#score h3 {
    font-size: 40px;
    color: #2563eb;
}
</style>
</head>

<body>

<div id="quiz" class="card">

    <div id="progress"></div>

    <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
    </div>

    <div id="question" class="question"></div>

    <img id="questionImage">

    <div id="options"></div>

    <button id="submitBtn">Submit</button>
    <button id="nextBtn">Next</button>

    <div id="result"></div>

    <div id="explanation">
        <span class="exp-title">Giải thích</span>
        <div id="explanationText"></div>
    </div>

</div>

<div id="summary" class="card">
    <h2>Kết quả</h2>
    <div id="score"></div>

    <button onclick="location.reload()">
        Làm lại
    </button>
</div>

<script>

const questions = [
  {
    "question": "You are building a structured data-extraction system using Claude. The system extracts information from unstructured documents, validates output against JSON schemas, and integrates the results with downstream systems.Monitoring reveals that specifications sometimes appear inconsistently within source documents.For example, a summary section might state \"Battery: 4000 mAh,\" while the detailed specifications table states \"Battery: 4200 mAh.\" Your current schema contains a single battery_capacity field.This inconsistency occurs in approximately 15% of documents, and historical analysis confirms that the detailed specifications table is accurate 90% of the time.What is the most effective approach?",
    "options": [
      "Change the field to an array that captures every discovered value and its source location, leaving downstream systems to apply precedence rules.",
      "Reject every extraction containing conflicting values and require the source document to be corrected before processing continues.",
      "Add extraction instructions specifying that values from the detailed specifications table take precedence when conflicting values exist, while retaining the single-value schema.",
      "Add a conflict_detected Boolean field and route every affected document for manual review."
    ],
    "answers": [
      "Add extraction instructions specifying that values from the detailed specifications table take precedence when conflicting values exist, while retaining the single-value schema."
    ],
    "qa_explanation": "Option C converts an empirically validated source hierarchy into an explicit extraction rule. The downstream contract requires one battery_capacity value, and historical analysis establishes that the detailed specifications table is substantially more reliable than the summary section. Claude should therefore be instructed to inspect all occurrences, detect conflicts, and select the detailed- table value when the two locations disagree.<br/>Anthropic's prompting guidance emphasizes clear, direct instructions, relevant context, and explicit decision rules when order or completeness matters. Providing the reason for the precedence rule also helps the model generalize it to comparable specification conflicts."
  },
  {
    "question": "You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, CLAUDE.md configurations, and understand when to use plan mode vs direct execution.Your team has three requirements for Claude Code's behavior in your project1. Claude must never modify files in the db/migrations/ directory2. Claude should prefer your custom logging module over console.log3. All TypeScript files must be auto-formatted with Prettier afterevery editAll three are currently written as instructions in your project's CLAUDE.md. During a complex refactoring session, a developer discovers that Claude edited a migration file, violating requirement #1. How should you restructure these requirements across Claude Code's configuration mechanisms?",
    "options": [
      "Add Edit(./db/migrations/**) to permissions.deny in the project settings, keep the logging preference in CLAUDE.md, and add a PostToolUse hook on the Edit tool that runs Prettier on changed TypeScript files.",
      "Move all three requirements into .claude/rules/ as path-scoped rules: one targeting db/migrations/** that forbids editing those files, and others targeting **/*.ts for the logging convention and formatting instruction.",
      "Rewrite all three requirements in CLAUDE.md using stronger directive language and add few- shot examples that demonstrate Claude refusing to edit migration files and running Prettier after edits.",
      "Configure hooks for all three: a PreToolUse hook script that blocks Edit calls targeting db/migrations/,a PreToolUse hook script that adds logging convention context before edits, and a PostToolUse hook that runs Prettier after TypeScript edits."
    ],
    "answers": [
      "Add Edit(./db/migrations/**) to permissions.deny in the project settings, keep the logging preference in CLAUDE.md, and add a PostToolUse hook on the Edit tool that runs Prettier on changed TypeScript files."
    ],
    "qa_explanation": "Hard restrictions belong in permission controls, coding preferences belong in CLAUDE.md, and deterministic formatting belongs in an automated hook. Instructions alone cannot reliably prevent prohibited file edits."
  },
  {
    "question": "A developer wants Claude to explain every reasoning step internally before answering. Why might this request be inappropriate?",
    "options": [
      "Claude requires GPU acceleration.",
      "Internal reasoning should not be relied upon as an application feature.",
      "JSON cannot contain reasoning.",
      "Temperature prevents explanations."
    ],
    "answers": [
      "Internal reasoning should not be relied upon as an application feature."
    ],
    "qa_explanation": "Applications should evaluate Claude based on observable outputs rather than expecting access to internal reasoning processes. Prompting should request useful explanations or evidence instead of relying on hidden reasoning mechanisms."
  },
  {
    "question": "You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, CLAUDE.md configurations, and understand when to use plan mode vs direct execution.Your team wants Claude to follow a detailed code review checklist (8 items covering API changes, test coverage, documentation, security, etc.) when reviewing pull requests. The team also uses Claude extensively for other tasks: writing new features, debugging production issues, and generating documentation. Currently, developers paste the checklist at the start of each review session. Which approach best addresses this workflow need?",
    "options": [
      "Create a /review slash command containing the checklist, invoked when starting reviews.",
      "Create a dedicated review subagent with the checklist embedded in its configuration.",
      "Configure plan mode as the default for code review sessions.",
      "Add the checklist to the project's CLAUDE.md file under a \"Code Review\" section."
    ],
    "answers": [
      "Create a /review slash command containing the checklist, invoked when starting reviews."
    ],
    "qa_explanation": "A reusable command is ideal for a checklist or procedure that developers invoke only during code reviews. It avoids repeatedly pasting the checklist and prevents review-specific instructions from consuming context during unrelated tasks."
  },
  {
    "question": "You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.Your automated review calls the Claude API for each pull request, using tool_use with a report_findings tool that returns a JSON array of finding objects. Each object contains file_path, line_number, severity, category, and description. During testing on a large pull request touching more than 30 files, the response reaches the max_tokens limit and is truncated in the middle of the JSON, causing your pipeline's parser to fail.What is the most effective way to handle this?",
    "options": [
      "Split the review into multiple API calls that each analyze a subset of the changed files, and then merge the resulting findings arrays.",
      "Increase max_tokens to the model's maximum and instruct Claude to keep each finding description under 50 words.",
      "Switch from tool_use to prompting Claude to return findings as a Markdown list.",
      "Add retry logic that detects truncated JSON and resends the request with instructions to report only critical and high-severity findings."
    ],
    "answers": [
      "Split the review into multiple API calls that each analyze a subset of the changed files, and then merge the resulting findings arrays."
    ],
    "qa_explanation": "Option A is correct because the failure results from excessive output volume, not from JSON or tool use. Anthropic documents that max_tokens is a hard output ceiling and that a response stopped at this limit reports stop_reason: \"max_tokens\". Its tool-streaming guidance also warns that generation can stop midway through a tool parameter, leaving partial JSON that must not be treated as complete. Splitting the pull request into bounded file groups limits the number of findings produced by each call, preserves the report_findings schema, and allows the pipeline to validate every response independently before merging and deduplicating the arrays. Shared dependency context can still be included when cross-file analysis is required."
  },
  {
    "question": "You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, CLAUDE.md configurations, and understand when to use plan mode vs direct execution.Your team's CLAUDE.md includes a rule: \"Use 4-space indentation and always run Prettier formatting.\" Despite this, code reviews reveal that roughly 30% of files Claude Code generates use inconsistent formatting - sometimes 2-space indentation, sometimes missing trailing commas. Adding emphasis (\"IMPORTANT: You MUST use Prettier formatting\") reduces violations to about 15%, but doesn't eliminate them. What is the most effective way to ensure all generated code is consistently formatted?",
    "options": [
      "Configure a PostToolUse hook with an Edit|Write matcher that automatically runs Prettier on each file Claude modifies.",
      "Split the formatting rules into path-scoped .claude/rules/files that load when Claude works on matching file types.",
      "Extract the formatting rules into a dedicated skill that Claude loads automatically when generating code, with more detailed examples of correct formatting.",
      "Add a Stop hook with a prompt-based check that evaluates whether generated code follows formatting standards and prompts Claude to fix violations."
    ],
    "answers": [
      "Configure a PostToolUse hook with an Edit|Write matcher that automatically runs Prettier on each file Claude modifies."
    ],
    "qa_explanation": "Hooks provide deterministic enforcement. Running Prettier automatically after every file edit or write guarantees consistent formatting, whereas instructions, rules, skills, or prompt-based checks still depend on model compliance."
  },
  {
    "question": "You are building a multi-agent research system using the Claude Agent SDK. A coordinator agent delegates to specialized subagents: one searches the web, one analyzes documents, one synthesizes findings, and one generates reports. The system researches topics and produces comprehensive, cited reports.In production, you observe that simple fact-checking queries, such as \"In what year was the Paris Climate Agreement signed?\", traverse all four subagents sequentially, consuming more than 40 seconds and significant tokens per query. Complex comparative research benefits from the complete pipeline. Your query distribution is diverse and continues to evolve as users discover new applications.What is the most effective approach to optimize for varying query complexity?",
    "options": [
      "Create a fast path for factual questions that bypasses subagents entirely, routing every other query through the complete pipeline.",
      "Train a query-complexity classifier using labeled historical data to predict the optimal subagent combination, retraining it periodically.",
      "Implement pattern-based routing that classifies queries as single-fact, comparative, or analytical and maps each category to a predefined subagent combination.",
      "Have the coordinator analyze each query and dynamically determine which subagents are required."
    ],
    "answers": [
      "Have the coordinator analyze each query and dynamically determine which subagents are required."
    ],
    "qa_explanation": "Option D allows orchestration effort to scale with the actual request. A simple factual query may require only the web-search agent and a direct coordinator response, whereas a comparative investigation may require web research, document analysis, synthesis, and report generation.<br/>Anthropic's Building Effective AI Agents describes the orchestrator-workers pattern as a central model dynamically identifying subtasks, delegating them, and combining the results. It is specifically appropriate when the required subtasks cannot be predicted reliably in advance.<br/>Anthropic's multi- agent research architecture likewise emphasizes varying the number of agents and tool calls according to task complexity."
  },
  {
    "question": "When implementing your lookup_order MCP tool, the backend sometimes returns errors (e.g.,\"Order not found\" or temporary database failures). What is the correct pattern for communicating these errors back to the agent?",
    "options": [
      "Throw an exception from the tool handler so the agent framework can catch and log it",
      "Return the error message in the tool result content with the isError flag set to true",
      "Log the error server-side and return an empty result to avoid confusing the model",
      "Return a success response with a \"status\" field indicating the error type"
    ],
    "answers": [
      "Return the error message in the tool result content with the isError flag set to true"
    ],
    "qa_explanation": "Returning structured tool results with isError set to true allows the agent to receive explicit error signals while preserving the error message. This enables the agent to reason about the failure, choose appropriate recovery actions, and provide meaningful feedback to the user."
  },
  {
    "question": "During testing, you find that when a customer says \"I need a refund for my recent purchase,\" the agent calls process _refund immediately - but populates the required order_id parameter with a plausible-looking but fabricated value instead of first calling lookup_order to retrieve the actual order ID. The refund call fails because the fabricated ID doesn't exist. Which change directly addresses the root cause of the agent fabricating the order_id value?",
    "options": [
      "Switch tool_choice from \"auto\" to \"any\" to force the agent to make a tool call on every turn.",
      "Update the process_refund tool description to explicitly state that order_id must be obtained from a prior lookup_order call and must never be assumed or invented.",
      "Pre-parse incoming customer messages to extract any order IDs mentioned, and inject them into the conversation context before passing to Claude.",
      "Add server-side validation that checks whether the order_id exists in your database before executing the refund, returning an error to the agent if not found."
    ],
    "answers": [
      "Update the process_refund tool description to explicitly state that order_id must be obtained from a prior lookup_order call and must never be assumed or invented."
    ],
    "qa_explanation": "The failure originates from an underspecified tool contract. A precise description tells Claude where the required parameter must come from and prevents it from fabricating an identifier.<br/>Server-side validation in D is still valuable as a safeguard, but it detects the error rather than addressing the agent's decision-making. Anthropic identifies detailed tool and parameter descriptions as the most important factor in reliable tool use."
  },
  {
    "question": "You are integrating Claude Code into your Continuous Integration/Continuous Deployment (CI/CD) pipeline. The system runs automated code reviews, generates test cases, and provides feedback on pull requests. You need to design prompts that provide actionable feedback and minimize false positives.Your automated code review is missing genuine bugs in pull requests. Investigation reveals that your review prompt includes the instruction: \"Only flag critical issues that would definitely cause production failures. Ignore minor concerns and anything you are uncertain about.\" Developers confirm that some missed bugs are genuine logic errors that the model investigated but chose not to report. The team requires the review output to remain structured, with each finding tagged with metadata, and actionable.Which prompt change both removes the cause of the suppressed findings and preserves structured, tagged output for downstream filtering?",
    "options": [
      "Add a second review pass that rereads the diff using the same prompt, looking for anything the first pass may have missed.",
      "Instruct the model to report all findings with confidence and severity tags, deferring filtering to a downstream step.",
      "Remove all severity-related instructions from the prompt and let the model use its default judgment about what to report.",
      "Enable extended thinking and instruct the model to reason step by step about every code change before producing its review."
    ],
    "answers": [
      "Instruct the model to report all findings with confidence and severity tags, deferring filtering to a downstream step."
    ],
    "qa_explanation": "Option B removes the prompt-level suppression responsible for the false negatives while preserving machine-readable metadata. Anthropic's current code-review prompting guidance warns that instructions such as \"only report high-severity issues\" or \"be conservative\" may be followed literally:<br/>Claude can identify genuine defects during analysis but omit them from its output. Anthropic recommends requesting all findings and applying filtering separately.<br/>Confidence and severity fields allow downstream code to apply adjustable thresholds without forcing the model to discard evidence during generation. A schema can require fields such as file, line, description, severity, confidence, evidence, and recommended action; Anthropic's Structured Outputs documentation supports enforcing such a response contract."
  },
  {
    "question": "Your automated review generates many findings per pull request, but developer feedback shows that roughly half are dismissed as \"not worth addressing.\" Analysis reveals that dismissed findings are often technically accurate but involve minor style preferences or patterns that are acceptable in your codebase. Before adding infrastructure complexity, what prompt-design change could most effectively reduce dismissals while maintaining the detection of genuine issues?",
    "options": [
      "Add explicit criteria defining which issues to report, such as bugs and security defects, and which issues to skip, such as minor style preferences and accepted local patterns.",
      "Implement a secondary classification model that filters Claude's findings according to predicted developer acceptance.",
      "Ask Claude to rate every finding's confidence from 1 to 10 and include only findings rated 8 or higher.",
      "Append instructions telling Claude to \"only report findings you are highly confident are genuine problems.\""
    ],
    "answers": [
      "Add explicit criteria defining which issues to report, such as bugs and security defects, and which issues to skip, such as minor style preferences and accepted local patterns."
    ],
    "qa_explanation": "The problem is an undefined relevance threshold. Claude is finding technically valid observations, but the prompt does not clearly distinguish actionable defects from acceptable conventions and low-value style preferences. Option A establishes explicit positive and negative reporting criteria, allowing the model to apply the team's actual definition of a useful finding during generation.<br/>Anthropic's prompt-engineering guidance emphasizes clear, specific instructions and well-defined success criteria. The managed Code Review documentation similarly recommends defining skipped categories, generated paths, severity rules, and evidence requirements. Reporting \"bugs affecting correctness or security\" while excluding \"formatting handled by CI and documented local conventions\" is substantially more precise than asking the model to be generally conservative."
  },
  {
    "question": "You are building a structured data extraction system using Claude. The system extracts information from unstructured documents, validates the output using JavaScript Object Notation (JSON) schemas, and maintains high accuracy. It must handle edge cases gracefully and integrate with downstream systems.Your system has been running for 3 weeks and human reviewers have corrected 847 extractions.Analysis reveals a recurring pattern: when recipes use informal measurements like \"a handful\" or\"a splash,\" the model either invents specific amounts or leaves fields empty--accounting for 23% of all corrections.How should you use this feedback to improve extraction accuracy?",
    "options": [
      "Fine-tune the model on the 847 corrected extractions.",
      "Add few-shot examples to your prompt demonstrating correct handling of informal measurements--extracting them verbatim rather than converting or omitting them.",
      "Implement a post-processing layer that uses pattern matching to detect informal measurement phrases in source text and automatically populate values when the extraction is empty.",
      "Update your JSON schema to add a \"measurement_type\" enum field (precise/informal)."
    ],
    "answers": [
      "Add few-shot examples to your prompt demonstrating correct handling of informal measurements--extracting them verbatim rather than converting or omitting them."
    ],
    "qa_explanation": "The reviewer corrections have exposed a narrow and repeatable interpretation failure. The desired policy is clear: informal measurements are valid source values and must be preserved verbatim rather than normalized into invented quantities or treated as missing. This behavior can be communicated efficiently through targeted few-shot examples.<br/>Anthropic recommends examples for demonstrating expected behavior and improving consistency. Examples can pair source phrases such as \"a handful of spinach,\" \"a splash of vinegar,\" and \"a pinch of salt\" with outputs that retain handful, splash, and pinch exactly.<br/>Additional counterexamples can show that Claude must not convert these phrases into grams, millilitres, or estimated serving quantities."
  },
  {
    "question": "Your automated review CI jobs take 18 seconds to initialize before Claude begins analyzing code.Profiling reveals that the delay comes from automatically discovering hooks, MCP servers, plugins, skills, and multiple nested CLAUDE.md files throughout your monorepo. You need to reduce startup time while ensuring that reviews still enforce your team's coding standards, which are documented in the root-level CLAUDE.md file. What is the most effective approach?",
    "options": [
      "Run in --bare mode and specify all review criteria directly in the -p prompt argument for every CI invocation, without referencing external files.",
      "Replace the default prompt entirely by using --system-prompt-file ./CLAUDE.md, which bypasses default prompt assembly and loads only your project rules.",

      "Keep the default initialization and add --exclude-dynamic-system-prompt-sections to reduce per- machine prompt variability and improve prompt-cache hit rates across runners."
    ],

    "qa_explanation": "Claude Code's --bare option is specifically designed for faster scripted execution. It skips automatic discovery of CLAUDE.md files, hooks, skills, plugins, MCP servers, and auto-memory while retaining essential built-in capabilities such as Bash, file reading, and file editing. Because -- bare also prevents automatic loading of the root CLAUDE.md, the required standards must be added explicitly.<br/>Option C accomplishes both objectives. --append-system-prompt-file ./CLAUDE.md loads the project standards into the current invocation while preserving Claude Code's default coding-agent system prompt and tool-use guidance. According to the official Claude Code CLI reference, append flags add file contents to the default system prompt, whereas replacement flags discard that default guidance."
  },
  {
    "question": "Your get_portfolio_value tool returns the total value of a user's investment portfolio. You're deciding between returning a structured JSON object with explicit fields versus returning the information as a formatted text string. What is the primary advantage of using structured output with defined fields?",

  {
    "question": "Your MCP server implements a check_availability tool that queries an external calendar API.During testing, you encounter three error conditions: (1) the tool is called with a malformed request missing the required user_email parameter, (2) the calendar API returns a 404 because the specified user doesn't exist in the calendar system, and (3) the calendar API returns a 503 because the service is temporarily unavailable. How should each error be reported according to MCP's error handling design?",
    "options": [
      "Report all three as tool results with isError: true.",

  },
  {
    "question": "An application frequently repeats the same background instructions in every API request. What is a potential downside?",
    "options": [
      "Lower reliability.",
      "Higher token usage and cost.",
      "Reduced model capability.",
      "Increased hallucinations only."
    ],
    "answers": [

  {
    "question": "Production logs reveal inconsistent error handling: when lookup_order fails, the agent sometimes retries 5+ times (wasteful when the order ID doesn't exist), sometimes escalates immediately (premature for temporary network issues), and sometimes asks users for clarification (inappropriate when the issue is a backend permission error). Investigation shows your MCP tool returns uniform error responses: {\"isError\": true, \"content\": [{\"type\": \"text\", \"text\": \"Operation failed\"}]}. The agent cannot distinguish between error types. What's the most effective improvement?",
    "options": [
      "Create an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action.",
      "Add few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each.",
      "Enhance error responses with structured metadata: include errorCategory (transient/validation/permission), isRetryable boolean, and a description of what caused the failure.",

    "answers": [

  },
  {
    "question": "The agent verifies customer identity through a multi-step process before resetting passwords.During testing, you notice that after the customer answers the third verification question, the agent asks them to provide their name again, as if the earlier exchange never happened. What's the most likely cause of this behavior?",
    "options": [
      "The verification tool is clearing the agent's internal state after each successful validation step.",
      "Claude's memory retention is limited to two conversational turns by default, requiring explicit configuration to extend it.",

    "qa_explanation": "Claude relies on the conversation history included in each API request to maintain continuity across turns. If earlier messages are not passed forward, the agent will not have access to previously provided details and may ask for information again as though the exchange never occurred."

  {
    "question": "You are using Claude Code to accelerate software development. Your team uses it for code generation, refactoring, debugging, and documentation. You need to integrate it into your development workflow with custom slash commands, CLAUDE.md configurations, and understand when to use plan mode vs direct execution.A security audit requires updating your authentication library from v2 to v3. The migration guide documents breaking changes: authenticate() now returns a Promise instead of accepting a callback, the User type has restructured fields, and three deprecated methods were removed.Grep shows the library is imported in 45 files across several modules.What's the most effective approach?",
    "options": [

function shuffle(array) {
    const result = [...array];
    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
}

// ================= INIT =================
let quizQuestions = shuffle(
    questions.map(q => ({
        ...q,
        options: shuffle(q.options)
    }))
).slice(0);
// filter question has image
// quizQuestions = quizQuestions.filter(item => 'image' in item);

let currentIndex = 0;
let score = 0;

// ================= ELEMENTS =================
const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const resultEl = document.getElementById("result");
const progressEl = document.getElementById("progress");
const progressFill = document.getElementById("progressFill");
const imgEl = document.getElementById("questionImage");

const explanationEl = document.getElementById("explanation");
const explanationTextEl = document.getElementById("explanationText");

const submitBtn = document.getElementById("submitBtn");
const nextBtn = document.getElementById("nextBtn");

// ================= LOAD =================
function loadQuestion() {

    const q = quizQuestions[currentIndex];

    progressEl.textContent =
        `Câu ${currentIndex + 1}/${quizQuestions.length}`;

    progressFill.style.width =
        ((currentIndex + 1) / quizQuestions.length) * 100 + "%";

    questionEl.textContent = q.question;

    // IMAGE
    if (q.image) {
        imgEl.src = q.image;
        imgEl.style.display = "block";
    } else {
        imgEl.style.display = "none";
    }

    // RENDER OPTIONS (radio or checkbox)
    const inputType = q.answers.length > 1 ? "checkbox" : "radio";

    optionsEl.innerHTML = q.options.map(opt => `
        <div class="option">
            <label>
                <input type="${inputType}" name="answer" value="${opt}">
                <span>${opt}</span>
            </label>
        </div>
    `).join("");

    resultEl.innerHTML = "";

    explanationEl.style.display = "none";
    explanationTextEl.innerHTML = "";

    submitBtn.disabled = false;
    nextBtn.style.display = "none";
}

// ================= SUBMIT =================
function submitAnswer() {

    const q = quizQuestions[currentIndex];

    let selected = [...optionsEl.querySelectorAll("input:checked")]
        .map(x => x.value)
        .sort();

    if (selected.length === 0) {
        alert("Vui lòng chọn đáp án");
        return;
    }

    const correct = [...q.answers].sort();

    const isCorrect =
        JSON.stringify(selected) === JSON.stringify(correct);

    if (isCorrect) {
        score++;
        resultEl.className = "correct";
        resultEl.innerHTML = "✓ Chính xác";
    } else {
        resultEl.className = "wrong";
        resultEl.innerHTML =
            "✗ Sai. Đáp án đúng: " + q.answers.join(", ");
    }

    // Hiển thị giải thích (neu co)
    if (q.qa_explanation) {
        explanationTextEl.innerHTML = q.qa_explanation;
        explanationEl.style.display = "block";
    } else {
        explanationEl.style.display = "none";
    }

    optionsEl.querySelectorAll("input")
        .forEach(x => x.disabled = true);

    submitBtn.disabled = true;
    nextBtn.style.display = "inline-block";
}

// ================= NEXT =================
function nextQuestion() {

    currentIndex++;

    if (currentIndex >= quizQuestions.length) {
        finishQuiz();
        return;
    }

    loadQuestion();
}

// ================= FINISH =================
function finishQuiz() {

    document.getElementById("quiz").style.display = "none";
    document.getElementById("summary").style.display = "block";

    const percent =
        Math.round(score * 100 / quizQuestions.length);

    document.getElementById("score").innerHTML = `
        <h3>${score}/${quizQuestions.length}</h3>
        <p>Đúng: ${percent}%</p>
    `;
}

// ================= EVENTS =================
submitBtn.addEventListener("click", submitAnswer);
nextBtn.addEventListener("click", nextQuestion);

// ================= START =================
loadQuestion();

</script>
